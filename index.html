<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shailyn Macedo — Houston based.">
  <title>Shailyn Macedo | Houston Based</title>
  <style>
    :root {
      --pink: #f7dce5;
      --pink-soft: #fff4f7;
      --rose: #b86f86;
      --ink: #3f3036;
      --white: #fffafc;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--pink-soft);
      color: var(--ink);
    }

    .page { min-height: 100vh; overflow: hidden; }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px clamp(22px, 5vw, 72px);
      color: white;
      text-shadow: 0 2px 18px rgba(0,0,0,.28);
    }

    .logo {
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .location {
      font-family: Arial, sans-serif;
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(79,42,61,.18), rgba(79,42,61,.38)),
        url("https://tec.edu.vn/wp-content/uploads/2022/01/Ve-may-bay-di-Houston-gia-re.jpg") center center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(255,221,232,.12), rgba(245,190,207,.18));
      mix-blend-mode: screen;
    }

    .hero-card {
      width: min(900px, calc(100% - 40px));
      padding: clamp(42px, 8vw, 82px) clamp(28px, 7vw, 75px);
      text-align: center;
      background: rgba(255, 244, 247, .87);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 34px;
      box-shadow: 0 25px 80px rgba(69, 37, 49, .22);
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      color: var(--rose);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 9vw, 7.5rem);
      line-height: .92;
      font-weight: 500;
      letter-spacing: -.055em;
      color: #3b2931;
    }

    .tagline {
      margin: 28px auto 0;
      max-width: 560px;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      line-height: 1.7;
      color: #6e525d;
    }

    .pill {
      display: inline-flex;
      margin-top: 30px;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.68);
      color: var(--rose);
      font-family: Arial, sans-serif;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    footer {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 3;
      color: rgba(255,255,255,.9);
      font-family: Arial, sans-serif;
      font-size: .68rem;
      letter-spacing: .08em;
      text-shadow: 0 2px 12px rgba(0,0,0,.4);
    }

    @media (max-width: 600px) {
      header { padding: 22px 20px; }
      .location { display: none; }
      .hero-card { border-radius: 24px; }
      h1 { font-size: clamp(3.1rem, 16vw, 5rem); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo">Shailyn Macedo</div>
      <div class="location">Houston, Texas</div>
    </header>

    <main class="hero" id="home">
      <div class="hero-card">
        <div class="eyebrow">A little corner of the city</div>
        <h1>Houston based.</h1>
        <p class="tagline">A soft, personal space for Shailyn Macedo — inspired by the city I call home.</p>
        <div class="pill">Houston · Texas</div>
      </div>
    </main>

    <footer>© 2026 Shailyn Macedo</footer>
  </div>
</body>
</html>
